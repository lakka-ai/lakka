name: release

# A release, from a tag such as v1.2.3 on a commit CI has passed (NF-D4, NF-S7, ADR 0075 Q3,
# ADR 0086). Each architecture builds on its own native runner and pushes by digest only; the
# pushed bytes are pulled back, scanned, measured and run from a release bundle before anything
# is tagged. Then the images become one manifest list per image, signed keylessly with the
# workflow's GitHub OIDC identity, with build provenance. The bundle names every image by digest
# and is signed too.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/lakka-ai/lakka
  CADDY_IMAGE: ghcr.io/lakka-ai/lakka-caddy

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          set -euo pipefail
          mkdir -p digests
          for name in app caddy; do
            case "$name" in
              app) image=$APP_IMAGE file=docker/Dockerfile ;;
              caddy) image=$CADDY_IMAGE file=docker/caddy.Dockerfile ;;
            esac
            docker buildx build --platform "linux/${{ matrix.arch }}" -f "$file" \
              --build-arg "LAKKA_VERSION=$GITHUB_REF_NAME" \
              --build-arg "LAKKA_REVISION=$GITHUB_SHA" \
              --provenance=mode=max --sbom=true \
              --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$name.json" .
            node -p "require('./$name.json')['containerimage.digest']" > "digests/$name-${{ matrix.arch }}"
          done

      # The bytes just pushed, not a local build: what gets tagged is what was tested.
      - name: Pull what was pushed
        run: |
          docker pull "$APP_IMAGE@$(cat digests/app-${{ matrix.arch }})"
          docker tag "$APP_IMAGE@$(cat digests/app-${{ matrix.arch }})" lakka/app:release
          docker pull "$CADDY_IMAGE@$(cat digests/caddy-${{ matrix.arch }})"
          docker tag "$CADDY_IMAGE@$(cat digests/caddy-${{ matrix.arch }})" lakka/caddy:release

      - name: Scan (NF-S7)
        run: scripts/scan.sh lakka/app:release lakka/caddy:release

      - name: Image size budget (NF-D6)
        run: sh docker/image-size.sh lakka/app:release lakka/caddy:release

      - name: Offline embedding within budget (NF-D5, NF-D8)
        run: |
          docker run --rm --network none --cpus 2 lakka/app:release embed-bench \
            --threads 1 --reference /app/models/reference/paraphrase-multilingual-MiniLM-L12-v2.json --max-p95-ms 100
          # mpnet at two threads, held to 200 ms, which amd64 needs (ADR 0123).
          docker run --rm --network none --cpus 2 \
            -e LAKKA_CLASSIFIER_MODEL_DIR=/app/models/paraphrase-multilingual-mpnet-base-v2 lakka/app:release embed-bench \
            --threads 2 --reference /app/models/reference/paraphrase-multilingual-mpnet-base-v2.json --max-p95-ms 200

      - name: The bundle starts, cold and offline (AC 1, 2, 3)
        run: scripts/bundle-smoke.sh lakka/app:release lakka/caddy:release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Sign in to the registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: One manifest list per image
        id: lists
        run: |
          set -euo pipefail
          # A prerelease such as v1.2.0-rc.1 is never `latest`.
          latest=()
          case "$GITHUB_REF_NAME" in *-*) ;; *) latest=(latest) ;; esac
          for name in app caddy; do
            case "$name" in app) image=$APP_IMAGE ;; caddy) image=$CADDY_IMAGE ;; esac
            tags=(-t "$image:$GITHUB_REF_NAME")
            for t in "${latest[@]}"; do tags+=(-t "$image:$t"); done
            docker buildx imagetools create "${tags[@]}" \
              "$image@$(cat "digests/$name-amd64")" "$image@$(cat "digests/$name-arm64")"
            digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Sign the images (keyless)
        run: |
          cosign sign --yes "$APP_IMAGE@${{ steps.lists.outputs.app }}"
          cosign sign --yes "$CADDY_IMAGE@${{ steps.lists.outputs.caddy }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.lists.outputs.app }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CADDY_IMAGE }}
          subject-digest: ${{ steps.lists.outputs.caddy }}
          push-to-registry: true

      - name: The release bundle, every image pinned by digest
        run: |
          set -euo pipefail
          pin() {
            echo "$1=$1@$(docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          }
          postgres=$(grep -m1 -o 'pgvector/pgvector:[^ ]*' docker/compose.yaml)
          valkey=$(grep -m1 -o 'valkey/valkey:[^ ]*' docker/compose.yaml)
          node scripts/release-bundle.ts --version "$GITHUB_REF_NAME" --out dist/release \
            --image "lakka/app:local=$APP_IMAGE@${{ steps.lists.outputs.app }}" \
            --image "lakka/caddy:local=$CADDY_IMAGE@${{ steps.lists.outputs.caddy }}" \
            --image "$(pin "$postgres")" --image "$(pin "$valkey")"
          cosign sign-blob --yes \
            --bundle "dist/release/lakka-$GITHUB_REF_NAME.tar.gz.sigstore.json" \
            "dist/release/lakka-$GITHUB_REF_NAME.tar.gz"

      - name: Publish the release
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}" \
            "dist/release/lakka-$GITHUB_REF_NAME.tar.gz" \
            "dist/release/lakka-$GITHUB_REF_NAME.tar.gz.sha256" \
            "dist/release/lakka-$GITHUB_REF_NAME.tar.gz.sigstore.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
