# Postgres and Valkey for `pnpm dev`. Development only: trust auth and no password, published
# on loopback ports that do not clash with the full stack. Never use this file in production.
name: lakka-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: lakka
      POSTGRES_DB: lakka
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lakka', '-d', 'lakka']
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2-trixie
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
