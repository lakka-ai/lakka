# LibreChat, pointed at Lakka as a custom OpenAI-compatible endpoint (API-6, ADR 0064).
# Compatibility checks only (docker/compose.compat.yaml); never part of the product.
version: 1.3.13
cache: true
endpoints:
  custom:
    - name: 'lakka'
      apiKey: '${LAKKA_API_KEY}'
      baseURL: 'http://caddy/v1'
      models:
        # LibreChat falls back to this list when it cannot fetch the real one, so the checks
        # assert it is absent: the models shown must be the ones /v1/models returned.
        default: ['not-from-lakka']
        fetch: true
      titleConvo: false
      summarize: false
      modelDisplayLabel: 'Lakka'
